<script>
  google.charts.load('current', { packages: ['corechart'] });
  google.charts.setOnLoadCallback(initApp);

  const appState = {
    config: SERVER_CONFIG,
    sessionId: '',
    studentName: '',
    period: '',
    compare: null,
    extra: null,
    overlayAction: null,
    chartsReady: false,
    overlayOpen: false,
    overlayBusy: false
  };

  const LEFT_LUNG_SLOTS = [
    [176, 148], [153, 170], [195, 171], [140, 196], [176, 196], [209, 196], [154, 223], [191, 224],
    [133, 248], [168, 249], [203, 250], [147, 276], [181, 277], [214, 278], [160, 303], [195, 304],
    [141, 327], [176, 331], [208, 329], [193, 145]
  ];
  const RIGHT_LUNG_SLOTS = [
    [355, 148], [332, 170], [375, 170], [318, 196], [355, 196], [389, 196], [332, 223], [367, 223],
    [304, 248], [339, 248], [374, 249], [318, 276], [353, 277], [388, 278], [332, 303], [367, 304],
    [314, 327], [349, 330], [384, 329], [337, 146]
  ];
  const SLOT_ORDER = interleaveSlots(LEFT_LUNG_SLOTS, RIGHT_LUNG_SLOTS);

  function initApp() {
    appState.chartsReady = true;
    populatePeriods();
    bindEvents();
  }

  function populatePeriods() {
    const select = document.getElementById('periodSelect');
    select.innerHTML = '<option value="">Choose period</option>' + appState.config.periods.map(p => `<option value="${p}">${p}</option>`).join('');
  }

  function bindEvents() {
    byId('startBtn').addEventListener('click', startSession);
    byId('openCompareBtn').addEventListener('click', () => {
      if (!appState.compare) appState.compare = createCompareState();
      showScreen('screen-compare');
      renderCompareView();
    });
    byId('openExtraBtn').addEventListener('click', () => {
      if (!appState.extra) appState.extra = createExtraState();
      showScreen('screen-extra');
      renderExtraView();
    });

    byId('compareMainBtn').addEventListener('click', handleCompareMainButton);
    byId('compareRollBtn').addEventListener('click', rollComparePatientB);
    document.querySelectorAll('#compareRemoveControls .remove-btn').forEach(btn => {
      btn.addEventListener('click', () => removeFromActive('compare', btn.dataset.color));
    });

    byId('extraMainBtn').addEventListener('click', handleExtraMainButton);
    byId('extraRollBtn').addEventListener('click', rollExtraPatient);
    document.querySelectorAll('#extraRemoveControls .remove-btn').forEach(btn => {
      btn.addEventListener('click', () => removeFromActive('extra', btn.dataset.color));
    });

    byId('compareSubmitBtn').addEventListener('click', submitCompareMode);
    byId('extraSubmitBtn').addEventListener('click', submitExtraMode);
    byId('compareEmergencyBtn').addEventListener('click', () => emergencySubmit('compare'));
    byId('extraEmergencyBtn').addEventListener('click', () => emergencySubmit('extra'));
    byId('backToModesBtn1').addEventListener('click', () => showScreen('screen-mode'));
    byId('backToModesBtn2').addEventListener('click', () => showScreen('screen-mode'));
    byId('finishBackBtn').addEventListener('click', () => showScreen('screen-mode'));

    byId('overlayContinueBtn').onclick = continueOverlayAction;
    byId('overlay').addEventListener('click', (e) => {
      if (e.target && e.target.id === 'overlay') continueOverlayAction();
    });
    document.addEventListener('keydown', (e) => {
      if (!appState.overlayOpen) return;
      if (e.key === 'Enter' || e.key === 'Escape' || e.key === ' ') {
        e.preventDefault();
        continueOverlayAction();
      }
    });
  }

  function startSession() {
    const name = byId('studentName').value.trim();
    const period = byId('periodSelect').value;
    const errorEl = byId('loginError');
    errorEl.classList.add('hidden');
    errorEl.textContent = '';

    if (!name) return showLoginError('Please enter your full name.');
    if (!period) return showLoginError('Please choose your period.');

    setBusy(true);
    google.script.run
      .withSuccessHandler((result) => {
        setBusy(false);
        appState.sessionId = result.sessionId;
        appState.studentName = result.studentName;
        appState.period = result.period;
        appState.compare = null;
        appState.extra = null;
        byId('studentBadge').textContent = `${result.studentName} • Period ${result.period}`;
        byId('studentBadge').classList.remove('hidden');
        byId('compareStudentPill').textContent = `Student: ${result.studentName}`;
        byId('extraStudentPill').textContent = `Student: ${result.studentName}`;
        showScreen('screen-mode');
      })
      .withFailureHandler(handleServerError)
      .createSession(name, period);
  }

  function showLoginError(msg) {
    const errorEl = byId('loginError');
    errorEl.textContent = msg;
    errorEl.classList.remove('hidden');
  }

  function createCompareState() {
    const starting = cloneCounts(appState.config.compareStarting);
    return {
      roundsCompleted: 0,
      activeRound: 0,
      phase: 'idle',
      currentRoll: null,
      roundSummary: '',
      patientA: makePatient('Patient A', 'patient_a', starting),
      patientB: makePatient('Patient B', 'patient_b', starting, generatePoorAdherenceRolls(appState.config.compareRounds)),
      working: null,
      reflection: [],
      summary: null,
      submitted: false
    };
  }

  function createExtraState() {
    const starting = cloneCounts(appState.config.extraStarting);
    return {
      roundsCompleted: 0,
      activeRound: 0,
      phase: 'idle',
      currentRoll: null,
      roundSummary: '',
      patient: makePatient('Your patient', 'random_patient', starting),
      working: null,
      missedDoses: 0,
      reflection: [],
      summary: null,
      submitted: false
    };
  }

  function makePatient(label, type, counts, rolls) {
    return {
      label,
      type,
      counts: cloneCounts(counts),
      history: [makeHistoryStep(type === 'random_patient' ? 'extra' : 'compare', type, 0, '', 'Starting population', cloneCounts(counts))],
      displayHistory: [cloneCounts(counts)],
      rolls: Array.isArray(rolls) ? rolls.slice() : [],
      missedDoses: 0,
      flashAdded: []
    };
  }

  function handleCompareMainButton() {
    const state = appState.compare;
    if (!state || state.submitted) return;
    if (state.phase === 'idle' || state.phase === 'round_summary') beginCompareRound();
  }

  function handleExtraMainButton() {
    const state = appState.extra;
    if (!state || state.submitted) return;
    if (state.phase === 'idle' || state.phase === 'round_summary') beginExtraRound();
  }

  function beginCompareRound() {
    const state = appState.compare;
    if (state.roundsCompleted >= appState.config.compareRounds) return;
    state.activeRound = state.roundsCompleted + 1;
    state.currentRoll = null;
    state.roundSummary = '';
    state.patientA.flashAdded = [];
    state.patientB.flashAdded = [];
    const workingCounts = cloneCounts(state.patientA.counts);
    const removesLeft = Math.min(5, countTotal(workingCounts));
    state.working = { mode: 'compare', patientKey: 'patientA', roll: 4, workingCounts, removesLeft };
    state.phase = removesLeft > 0 ? 'a_remove' : 'b_roll';
    if (removesLeft === 0) {
      commitPatientRound(state.patientA, state.activeRound, 4, workingCounts, 'compare');
      state.working = null;
    }
    renderCompareView();
  }

  function beginExtraRound() {
    const state = appState.extra;
    if (state.roundsCompleted >= appState.config.extraRounds) return;
    state.activeRound = state.roundsCompleted + 1;
    state.currentRoll = null;
    state.roundSummary = '';
    state.patient.flashAdded = [];
    state.phase = 'extra_roll';
    state.working = null;
    renderExtraView();
  }

  function rollComparePatientB() {
    const state = appState.compare;
    if (!state || state.phase !== 'b_roll') return;
    const roll = state.patientB.rolls[state.activeRound - 1];
    state.currentRoll = roll;
    if (isMissedDose(roll)) {
      state.patientB.missedDoses += 1;
      state.phase = 'b_missed';
      renderCompareView();
      openOverlay('REMAINING BACTERIA REPRODUCE!', 'Patient B missed the dose, so no bacteria were killed. One of each remaining type will reproduce.', () => {
        const counts = cloneCounts(state.patientB.counts);
        const added = reproduceCounts(counts);
        state.patientB.flashAdded = added;
        commitPatientRound(state.patientB, state.activeRound, roll, counts, 'compare');
        finishCompareRound();
      });
      return;
    }
    const workingCounts = cloneCounts(state.patientB.counts);
    const removesLeft = Math.min(5, countTotal(workingCounts));
    state.working = { mode: 'compare', patientKey: 'patientB', roll, workingCounts, removesLeft };
    state.phase = removesLeft > 0 ? 'b_remove' : 'round_summary';
    if (removesLeft === 0) {
      commitPatientRound(state.patientB, state.activeRound, roll, workingCounts, 'compare');
      state.working = null;
      finishCompareRound();
      return;
    }
    renderCompareView();
  }

  function rollExtraPatient() {
    const state = appState.extra;
    if (!state || state.phase !== 'extra_roll') return;
    const roll = 1 + Math.floor(Math.random() * 6);
    state.currentRoll = roll;
    if (isMissedDose(roll)) {
      state.missedDoses += 1;
      state.phase = 'extra_missed';
      renderExtraView();
      openOverlay('REMAINING BACTERIA REPRODUCE!', 'The dose was missed this round, so one of each remaining type will reproduce.', () => {
        const counts = cloneCounts(state.patient.counts);
        const added = reproduceCounts(counts);
        state.patient.flashAdded = added;
        commitPatientRound(state.patient, state.activeRound, roll, counts, 'extra');
        finishExtraRound();
      });
      return;
    }
    const workingCounts = cloneCounts(state.patient.counts);
    const removesLeft = Math.min(5, countTotal(workingCounts));
    state.working = { mode: 'extra', patientKey: 'patient', roll, workingCounts, removesLeft };
    state.phase = removesLeft > 0 ? 'extra_remove' : 'round_summary';
    if (removesLeft === 0) {
      commitPatientRound(state.patient, state.activeRound, roll, workingCounts, 'extra');
      state.working = null;
      finishExtraRound();
      return;
    }
    renderExtraView();
  }

  function removeFromActive(mode, color) {
    const state = mode === 'compare' ? appState.compare : appState.extra;
    if (!state || !state.working || state.working.removesLeft <= 0) return;
    const counts = state.working.workingCounts;
    if (!canRemoveColor(counts, color)) return;
    if (!counts[color]) return;

    counts[color] -= 1;
    state.working.removesLeft -= 1;

    if (state.working.removesLeft <= 0) {
      if (mode === 'compare' && state.working.patientKey === 'patientA') {
        renderCompareView();
        openOverlay('REMAINING BACTERIA REPRODUCE!', 'Patient A finished treatment for this round. One of each remaining type will reproduce.', () => {
          const nextCounts = cloneCounts(state.working.workingCounts);
          const added = reproduceCounts(nextCounts);
          state.patientA.flashAdded = added;
          commitPatientRound(state.patientA, state.activeRound, 4, nextCounts, 'compare');
          state.working = null;
          state.phase = 'b_roll';
          renderCompareView();
        });
        return;
      }
      if (mode === 'compare' && state.working.patientKey === 'patientB') {
        const usedRoll = state.working.roll;
        renderCompareView();
        openOverlay('REMAINING BACTERIA REPRODUCE!', 'Patient B finished treatment for this round. One of each remaining type will reproduce.', () => {
          const nextCounts = cloneCounts(state.working.workingCounts);
          const added = reproduceCounts(nextCounts);
          state.patientB.flashAdded = added;
          commitPatientRound(state.patientB, state.activeRound, usedRoll, nextCounts, 'compare');
          state.working = null;
          finishCompareRound();
        });
        return;
      }
      if (mode === 'extra') {
        const usedRoll = state.working.roll;
        renderExtraView();
        openOverlay('REMAINING BACTERIA REPRODUCE!', 'The patient finished treatment for this round. One of each remaining type will reproduce.', () => {
          const nextCounts = cloneCounts(state.working.workingCounts);
          const added = reproduceCounts(nextCounts);
          state.patient.flashAdded = added;
          commitPatientRound(state.patient, state.activeRound, usedRoll, nextCounts, 'extra');
          state.working = null;
          finishExtraRound();
        });
        return;
      }
    }

    if (mode === 'compare') renderCompareView();
    else renderExtraView();
  }

  function finishCompareRound() {
    const state = appState.compare;
    const a = state.patientA.history[state.patientA.history.length - 1];
    const b = state.patientB.history[state.patientB.history.length - 1];
    state.roundsCompleted = state.activeRound;
    state.roundSummary = `Round ${state.activeRound} complete. Patient A has ${a.total} total bacteria. Patient B has ${b.total} total bacteria.`;
    state.phase = state.roundsCompleted >= appState.config.compareRounds ? 'finished' : 'round_summary';
    if (state.phase === 'finished') buildCompareReflection();
    renderCompareView();
  }

  function finishExtraRound() {
    const state = appState.extra;
    const end = state.patient.history[state.patient.history.length - 1];
    state.roundsCompleted = state.activeRound;
    state.roundSummary = `Round ${state.activeRound} complete. Your patient now has ${end.total} total bacteria.`;
    state.phase = state.roundsCompleted >= appState.config.extraRounds ? 'finished' : 'round_summary';
    if (state.phase === 'finished') buildExtraReflection();
    renderExtraView();
  }

  function renderCompareView() {
    const state = appState.compare;
    if (!state) return;

    const countsA = getDisplayedCounts('compare', 'patientA');
    const countsB = getDisplayedCounts('compare', 'patientB');
    const visibleRound = Math.max(state.roundsCompleted, state.activeRound || 0);
    byId('compareHeaderTitle').textContent = 'ANTIBIOTIC RUN';
    byId('compareRoundPill').textContent = `Round ${visibleRound} of ${appState.config.compareRounds}`;
    byId('compareRoundStatus').textContent = `${visibleRound} of ${appState.config.compareRounds}`;
    byId('compareMissedStatus').textContent = `${state.patientB.missedDoses} so far`;

    byId('compareAHeaderBadge').textContent = 'Dose: taken';
    byId('compareAHeaderBadge').className = 'small-status dose-good';
    updateRollReadout('compareRollCard', 'compareRollDie', 'compareBRollBadge', state.currentRoll, state.phase, 'Waiting for Patient B');
    byId('compareBHeaderBadge').className = 'small-status ' + getDoseBadgeClass(state.currentRoll, state.phase, true);
    byId('compareBHeaderBadge').textContent = getDoseBadgeText(state.currentRoll, state.phase, true);

    byId('compareAStatsBox').innerHTML = buildCountsBoxHtml(countsA);
    byId('compareBStatsBox').innerHTML = buildCountsBoxHtml(countsB);
    byId('compareABoard').innerHTML = buildBoardSvg('compareA', countsA, state.patientA.flashAdded);
    byId('compareBBoard').innerHTML = buildBoardSvg('compareB', countsB, state.patientB.flashAdded);

    byId('compareAStep').textContent = getCompareStepText('patientA', state, countsA);
    byId('compareBStep').textContent = getCompareStepText('patientB', state, countsB);

    drawChart('compareAChart', state.patientA.displayHistory, 'Patient A');
    drawChart('compareBChart', state.patientB.displayHistory, 'Patient B');

    renderCompareSidebar();
    updateCompareArcadeHud(state, countsA, countsB, visibleRound);

    const showReflection = !!state.summary && state.phase === 'finished';
    byId('screen-compare').classList.toggle('results-mode', showReflection);
    byId('compareReflectionWrap').classList.toggle('hidden', !showReflection);
    if (showReflection) {
      byId('compareSummary').innerHTML = buildCompareSummaryHtml(state.summary);
      renderQuestions('compareReflectionQuestions', state.reflection, 'compare');
    }
  }

  function renderExtraView() {
    const state = appState.extra;
    if (!state) return;
    const counts = getDisplayedCounts('extra', 'patient');
    const visibleRound = Math.max(state.roundsCompleted, state.activeRound || 0);
    byId('extraHeaderTitle').textContent = 'ANTIBIOTIC RUN';
    byId('extraRoundPill').textContent = `Round ${visibleRound} of ${appState.config.extraRounds}`;
    byId('extraRoundStatus').textContent = `${visibleRound} of ${appState.config.extraRounds}`;
    byId('extraMissedStatus').textContent = `${state.missedDoses} so far`;
    updateRollReadout('extraRollCard', 'extraRollDie', 'extraRollBadge', state.currentRoll, state.phase, 'Tap Roll when ready');
    byId('extraHeaderBadge').className = 'small-status ' + getDoseBadgeClass(state.currentRoll, state.phase, false);
    byId('extraHeaderBadge').textContent = getDoseBadgeText(state.currentRoll, state.phase, false);
    byId('extraStatsBox').innerHTML = buildCountsBoxHtml(counts);
    byId('extraBoard').innerHTML = buildBoardSvg('extra', counts, state.patient.flashAdded);
    byId('extraStep').textContent = getExtraStepText(state, counts);
    drawChart('extraChart', state.patient.displayHistory, 'Your patient');
    renderExtraSidebar();
    updateExtraArcadeHud(state, counts, visibleRound);

    const showReflection = !!state.summary && state.phase === 'finished';
    byId('screen-extra').classList.toggle('results-mode', showReflection);
    byId('extraReflectionWrap').classList.toggle('hidden', !showReflection);
    if (showReflection) {
      byId('extraSummary').innerHTML = buildExtraSummaryHtml(state.summary);
      renderQuestions('extraReflectionQuestions', state.reflection, 'extra');
    }
  }

  function renderCompareSidebar() {
    const state = appState.compare;
    const working = state.working;
    byId('compareMainBtn').classList.add('hidden');
    byId('compareRollBtn').classList.add('hidden');
    byId('compareRemoveControls').classList.add('hidden');
    byId('compareRemoveInfo').textContent = '';

    let title = 'Your action';
    let text = '';

    if (state.phase === 'idle') {
      title = 'Your action';
      text = 'Click Start compare mode. You will treat Patient A first, then Patient B.';
      byId('compareMainBtn').textContent = 'Start compare mode';
      byId('compareMainBtn').classList.remove('hidden');
    } else if (state.phase === 'a_remove') {
      title = 'Your action: Patient A';
      text = 'Remove 5 bacteria from Patient A. Start with red, then blue, then yellow.';
      byId('compareRemoveControls').classList.remove('hidden');
      byId('compareRemoveInfo').textContent = `${working.removesLeft} bacteria left to remove this round.`;
    } else if (state.phase === 'b_roll') {
      title = 'Your action: Patient B';
      text = 'Patient A is finished. Now roll for Patient B.';
      byId('compareRollBtn').classList.remove('hidden');
    } else if (state.phase === 'b_remove') {
      title = 'Your action: Patient B';
      text = `Patient B rolled ${state.currentRoll}. Remove 5 bacteria in the correct order.`;
      byId('compareRemoveControls').classList.remove('hidden');
      byId('compareRemoveInfo').textContent = `${working.removesLeft} bacteria left to remove this round.`;
    } else if (state.phase === 'b_missed') {
      title = 'Your action: Patient B';
      text = `Patient B rolled ${state.currentRoll}. The dose was missed, so the remaining bacteria will reproduce.`;
    } else if (state.phase === 'round_summary') {
      title = 'Round complete';
      text = state.roundSummary;
      if (state.roundsCompleted < appState.config.compareRounds) {
        byId('compareMainBtn').textContent = `Start Round ${state.roundsCompleted + 1}`;
        byId('compareMainBtn').classList.remove('hidden');
      }
    } else if (state.phase === 'finished') {
      title = 'Reflection';
      text = state.summary
        ? 'Use your graphs and your own results to answer the reflection questions below.'
        : 'Building your reflection questions from your data...';
    }

    byId('compareActionTitle').textContent = title;
    byId('compareInstruction').textContent = text;
    byId('compareActionText').textContent = text;
    updateRemoveButtons('compare');
  }

  function renderExtraSidebar() {
    const state = appState.extra;
    const working = state.working;
    byId('extraMainBtn').classList.add('hidden');
    byId('extraRollBtn').classList.add('hidden');
    byId('extraRemoveControls').classList.add('hidden');
    byId('extraRemoveInfo').textContent = '';

    let title = 'Your action';
    let text = '';

    if (state.phase === 'idle') {
      text = 'Click Start extra-credit mode to begin.';
      byId('extraMainBtn').textContent = 'Start extra-credit mode';
      byId('extraMainBtn').classList.remove('hidden');
    } else if (state.phase === 'extra_roll') {
      text = 'Roll the die to see whether the patient took the dose or missed it.';
      byId('extraRollBtn').classList.remove('hidden');
    } else if (state.phase === 'extra_remove') {
      text = `You rolled ${state.currentRoll}. Remove 5 bacteria in the correct order.`;
      byId('extraRemoveControls').classList.remove('hidden');
      byId('extraRemoveInfo').textContent = `${working.removesLeft} bacteria left to remove this round.`;
    } else if (state.phase === 'extra_missed') {
      text = `You rolled ${state.currentRoll}. The dose was missed, so the remaining bacteria will reproduce.`;
    } else if (state.phase === 'round_summary') {
      text = state.roundSummary;
      if (state.roundsCompleted < appState.config.extraRounds) {
        byId('extraMainBtn').textContent = `Start Round ${state.roundsCompleted + 1}`;
        byId('extraMainBtn').classList.remove('hidden');
      }
    } else if (state.phase === 'finished') {
      text = state.summary
        ? 'Use your graph and your own results to answer the reflection questions below.'
        : 'Building your reflection questions from your data...';
    }

    byId('extraActionTitle').textContent = title;
    byId('extraInstruction').textContent = text;
    byId('extraActionText').textContent = text;
    updateRemoveButtons('extra');
  }

  function updateCompareArcadeHud(state, countsA, countsB, visibleRound) {
    const activeKey = getCompareActivePatientKey(state);
    const activeCounts = activeKey === 'patientB' ? countsB : countsA;
    const activeLabel = activeKey === 'patientB' ? 'Patient B' : 'Patient A';
    const directive = getArcadeDirective('compare', state, activeLabel);
    const totalRounds = appState.config.compareRounds;

    setPhaseClasses('compareGameShell', 'mode-compare', state.phase, activeKey);
    byId('comparePatientACard').classList.toggle('active-patient', activeKey === 'patientA');
    byId('comparePatientBCard').classList.toggle('active-patient', activeKey === 'patientB');
    byId('compareDirectiveTitle').textContent = directive.title;
    byId('compareDirectiveSub').textContent = directive.sub;
    byId('compareRemainingBadge').textContent = state.working ? String(state.working.removesLeft) : '0';
    byId('compareActivePatientLabel').textContent = activeLabel;
    byId('compareCurrentPatient').textContent = activeLabel;
    byId('compareCountSummary').innerHTML = buildSummaryCountsHtml(activeCounts);
    byId('compareProgressDots').innerHTML = buildProgressDots(state.roundsCompleted, visibleRound, totalRounds);
    byId('comparePatientStatusTile').textContent = getPatientStatusText(countTotal(activeCounts));
    byId('compareScoreTile').textContent = `Round ${visibleRound} / ${totalRounds}`;
    byId('compareAchievementTile').textContent = getArcadeFeedback('compare', state, activeCounts);
  }

  function updateExtraArcadeHud(state, counts, visibleRound) {
    const directive = getArcadeDirective('extra', state, 'Your Patient');
    const totalRounds = appState.config.extraRounds;

    setPhaseClasses('extraGameShell', 'mode-extra', state.phase, 'patient');
    byId('extraPatientCard').classList.add('active-patient');
    byId('extraDirectiveTitle').textContent = directive.title;
    byId('extraDirectiveSub').textContent = directive.sub;
    byId('extraRemainingBadge').textContent = state.working ? String(state.working.removesLeft) : '0';
    byId('extraActivePatientLabel').textContent = 'Your Patient';
    byId('extraCountSummary').innerHTML = buildSummaryCountsHtml(counts);
    byId('extraProgressDots').innerHTML = buildProgressDots(state.roundsCompleted, visibleRound, totalRounds);
    byId('extraPatientStatusTile').textContent = getPatientStatusText(countTotal(counts));
    byId('extraScoreTile').textContent = `Round ${visibleRound} / ${totalRounds}`;
    byId('extraAchievementTile').textContent = getArcadeFeedback('extra', state, counts);
  }

  function getCompareActivePatientKey(state) {
    if (!state) return 'patientA';
    if (state.phase === 'b_roll' || state.phase === 'b_remove' || state.phase === 'b_missed') return 'patientB';
    if (state.working && state.working.patientKey) return state.working.patientKey;
    if (state.phase === 'round_summary' && state.roundsCompleted > 0) return 'patientB';
    return 'patientA';
  }

  function getArcadeDirective(mode, state, activeLabel) {
    if (!state) return { title: 'Mission Ready', sub: 'Start the simulation.' };
    const rollText = state.currentRoll ? `Roll ${state.currentRoll}. ` : '';
    if (state.phase === 'idle') return { title: 'Mission Ready', sub: 'Start the antibiotic run.' };
    if (state.phase === 'a_remove' || state.phase === 'b_remove' || state.phase === 'extra_remove') {
      const left = state.working ? state.working.removesLeft : 0;
      return { title: `Remove ${left} Bacteria`, sub: 'Red bacteria must be removed first.' };
    }
    if (state.phase === 'b_roll') return { title: 'Roll for Patient B', sub: 'A roll of 1 or 6 means the dose was missed.' };
    if (state.phase === 'extra_roll') return { title: 'Roll the Dose', sub: 'A roll of 1 or 6 means the dose was missed.' };
    if (state.phase === 'b_missed' || state.phase === 'extra_missed') {
      return { title: 'Missed Dose', sub: `${rollText}No bacteria are removed. Survivors reproduce.` };
    }
    if (state.phase === 'round_summary') return { title: 'Round Complete', sub: state.roundSummary || 'Compare the totals before moving on.' };
    if (state.phase === 'finished') return { title: 'Mission Debrief', sub: 'Use your graph and results to answer the reflection.' };

    if (state.phase === 'a_remove' || state.phase === 'b_remove' || state.phase === 'extra_remove') {
      if ((counts.red || 0) > 0) return 'Red first.';
      if ((counts.blue || 0) > 0) return 'Blue next.';
      return 'Yellow last.';
    }
    if (state.phase === 'b_missed' || state.phase === 'extra_missed') return 'Dose missed: survivors reproduce.';
    if (state.phase === 'round_summary') return 'Round complete.';

    const card = byId(cardId);

    const badge = byId(badgeId);

    const hasRoll = !!roll;

    card.classList.toggle('is-roll-phase', isRollPhase);
    card.classList.toggle('roll-taken', hasRoll && !missed);
    card.classList.toggle('roll-missed', missed);
    die.textContent = hasRoll ? String(roll) : '?';
    die.className = 'die-face ' + (hasRoll ? (missed ? 'die-missed' : 'die-taken') : (isRollPhase ? 'die-ready' : 'die-empty'));

    if (hasRoll) {
      badge.textContent = `Rolled ${roll} - ${missed ? 'dose missed' : 'dose taken'}`;

      badge.textContent = 'Tap Roll';
    } else {

  function buildTokenCircles(counts, flashAdded) {
    const items = [];
    for (let i = 0; i < counts.red; i++) items.push('red');
    for (let i = 0; i < counts.blue; i++) items.push('blue');
    for (let i = 0; i < counts.yellow; i++) items.push('yellow');

    const flashMap = {
      red: countMatching(flashAdded, 'red'),
      blue: countMatching(flashAdded, 'blue'),
      yellow: countMatching(flashAdded, 'yellow')
    };
    const seenByColor = { red: 0, blue: 0, yellow: 0 };
    const totalByColor = { red: counts.red, blue: counts.blue, yellow: counts.yellow };

    return items.map((color, idx) => {
      const slot = SLOT_ORDER[idx] || fallbackTokenSlot(idx);
      seenByColor[color] += 1;
      const threshold = totalByColor[color] - flashMap[color] + 1;
      const isNew = flashMap[color] > 0 && seenByColor[color] >= threshold;
      return buildBacteriaTokenSvg(color, slot[0], slot[1], idx, isNew);
    }).join('');
  }

  function fallbackTokenSlot(idx) {
    return [
      110 + ((idx * 47) % 340),
      142 + ((idx * 61) % 198)
    ];
  }

  function buildBacteriaTokenSvg(color, x, y, idx, isNew) {
    const rot = (idx * 37) % 360;
    const fresh = isNew ? ' new-token' : '';
    if (color === 'blue') {
      return `
        <g class="bacteria-token blue${fresh}" transform="translate(${x} ${y}) rotate(${rot})">
          <ellipse class="core" cx="0" cy="0" rx="17" ry="10" />
          <circle class="shine" cx="-6" cy="-3" r="3" />
          <circle class="shine" cx="4" cy="4" r="2" />
          <path class="spike" d="M-18 -2 L-24 -4 M-18 3 L-24 6 M18 -2 L24 -5 M18 4 L23 7" />
        </g>
      `;
    }
    const spikes = color === 'yellow'
      ? '<path class="spike" d="M0 -16 L0 -25 M11 -11 L18 -18 M16 0 L25 0 M11 11 L18 18 M0 16 L0 25 M-11 11 L-18 18 M-16 0 L-25 0 M-11 -11 L-18 -18" />'
      : '<path class="spike" d="M0 -15 L0 -23 M10 -10 L16 -17 M15 0 L23 0 M10 10 L16 17 M0 15 L0 23 M-10 10 L-16 17 M-15 0 L-23 0 M-10 -10 L-16 -17" />';
    return `
      <g class="bacteria-token ${color}${fresh}" transform="translate(${x} ${y}) rotate(${rot})">
        ${spikes}
        <circle class="core" cx="0" cy="0" r="${color === 'yellow' ? 15 : 14}" />
        <circle class="shine" cx="-5" cy="-5" r="4" />
        <circle class="shine" cx="5" cy="4" r="2" />
      </g>
    `;
  }

  function getCompareStepText(patientKey, state, counts) {
    if (state.phase === 'idle') return 'Step 1: Click Start compare mode to begin Round 1.';
    if (patientKey === 'patientA') {
      if (state.phase === 'a_remove') return `Step 1: Remove ${state.working.removesLeft} more bacteria. Start with red, then blue, then yellow.`;
      if (state.phase === 'b_roll' || state.phase === 'b_remove' || state.phase === 'b_missed') return `Patient A finished this round with ${countTotal(counts)} total bacteria.`;
    } else {
      if (state.phase === 'a_remove') return 'Step 2: Wait until Patient A finishes treatment.';
      if (state.phase === 'b_roll') return 'Step 2: Roll the die for Patient B.';
      if (state.phase === 'b_remove') return `Step 2: Remove ${state.working.removesLeft} more bacteria from Patient B.`;
      if (state.phase === 'b_missed') return 'Step 2: Dose missed. The remaining bacteria will reproduce.';
    }
    if (state.phase === 'round_summary') return state.roundSummary;
    if (state.phase === 'finished') return state.summary ? 'Simulation finished. Use your own data in the reflection.' : 'Building reflection questions...';
    return `This patient currently has ${countTotal(counts)} total bacteria.`;
  }

  function getExtraStepText(state, counts) {
    if (state.phase === 'idle') return 'Step 1: Click Start extra-credit mode to begin Round 1.';
    if (state.phase === 'extra_roll') return 'Step 1: Roll the die.';
    if (state.phase === 'extra_remove') return `Step 2: Remove ${state.working.removesLeft} more bacteria. Start with red, then blue, then yellow.`;
    if (state.phase === 'extra_missed') return 'Step 2: Dose missed. The remaining bacteria will reproduce.';
    if (state.phase === 'round_summary') return state.roundSummary;

    google.script.run
      .withSuccessHandler(() => {
        setBusy(false);
        showFinish(`<p><strong>Emergency submit saved.</strong></p><p>This submission was marked partial. Unfinished questions were scored as 0.</p><p>Recorded points: ${payload.summary.totalScore} / ${points.total}</p>`);
      })
      .withFailureHandler(handleServerError)
      .saveEmergencySubmission(payload);
  }

  function collectResponses(questions, pointsTotal) {
    if (!questions || !questions.length) return [];
    const perQuestion = pointsTotal / questions.length;
    return questions.map(q => {
      const isCorrect = q.selected === q.correctAnswer;
      return {
        questionId: q.questionId,
        prompt: q.prompt,
        selected: q.selected || '',
        correctAnswer: q.correctAnswer,
        isCorrect,
        pointsPossible: perQuestion,
        pointsEarned: isCorrect ? perQuestion : 0
      };
    });
  }

  function commitPatientRound(patient, round, roll, counts, mode) {
    patient.counts = cloneCounts(counts);
    patient.history.push(makeHistoryStep(mode, patient.type, round, roll, adherenceLabel(roll), cloneCounts(patient.counts)));
    patient.displayHistory.push(cloneCounts(patient.counts));
  }

  function makeHistoryStep(mode, patientType, round, roll, adherence, counts) {
    return {
      mode,
      patientType,
      round,
      roll,
      adherence,
      red: counts.red,
      blue: counts.blue,
      yellow: counts.yellow,
      total: countTotal(counts)
    };
  }

  function reproduceCounts(counts) {
    const added = [];
    ['red', 'blue', 'yellow'].forEach(color => {
      if (counts[color] > 0) {
        counts[color] += 1;
        added.push(color);
      }
    });
    return added;
  }

  function canRemoveColor(counts, color) {
    if ((counts.red || 0) > 0) return color === 'red';
    if ((counts.blue || 0) > 0) return color === 'blue';
    return color === 'yellow' && (counts.yellow || 0) > 0;
  }

  function adherenceLabel(roll) {
    if (roll === '' || roll === null || roll === undefined) return 'Starting population';
    return isMissedDose(roll) ? 'Missed dose' : 'Took dose on time';
  }

  function isMissedDose(roll) {
    return roll === 1 || roll === 6;
  }

  function generatePoorAdherenceRolls(rounds) {
    const missedCount = Math.random() < 0.5 ? 2 : 3;
    const picks = new Set();
    while (picks.size < missedCount) picks.add(1 + Math.floor(Math.random() * rounds));
    const arr = Array.from(picks).sort((a, b) => a - b);
    if (arr.length > 1) {
      const allEarly = arr.every(r => r <= Math.ceil(rounds / 2));
      const allLate = arr.every(r => r > Math.floor(rounds / 2));
      if (allEarly) arr[arr.length - 1] = rounds - Math.floor(Math.random() * 2);
      if (allLate) arr[0] = 1 + Math.floor(Math.random() * 2);
    }
    const missed = new Set(arr);
    const good = [2, 3, 4, 5];
    const bad = [1, 6];
    return Array.from({ length: rounds }, (_, idx) => missed.has(idx + 1)
      ? bad[Math.floor(Math.random() * bad.length)]
      : good[Math.floor(Math.random() * good.length)]);
  }

  function allQuestionsAnswered(questions) {
    return questions.every(q => !!q.selected);
  }

  function sumScores(responses) {
    return responses.reduce((sum, r) => sum + (r.pointsEarned || 0), 0);
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));
    byId(id).classList.add('active');
  }

  function showFinish(html) {
    byId('finishMessage').innerHTML = html;
    showScreen('screen-finish');
  }

  function openOverlay(title, text, action) {
    appState.overlayAction = action;
    appState.overlayOpen = true;
    appState.overlayBusy = false;
    byId('overlayTitle').textContent = title;
    byId('overlayText').textContent = text;
    const btn = byId('overlayContinueBtn');
    btn.disabled = false;
    btn.textContent = 'Continue';
    byId('overlay').classList.remove('hidden');
    setTimeout(() => btn.focus(), 0);
  }

  function continueOverlayAction() {
    if (!appState.overlayOpen || appState.overlayBusy) return;
    appState.overlayBusy = true;
    const action = appState.overlayAction;
    appState.overlayAction = null;
    appState.overlayOpen = false;
    byId('overlay').classList.add('hidden');

    try {
      if (typeof action === 'function') action();
    } catch (err) {
      console.error('Overlay action failed:', err);
      alert('Something went wrong while continuing the round. Please refresh and try again.');
    } finally {
      appState.overlayBusy = false;
    }
  }

  function setBusy(flag) {
    document.querySelectorAll('button').forEach(btn => {
      if (btn.id === 'overlayContinueBtn' && !flag) return;
      btn.disabled = flag;
    });
  }

  function handleServerError(err) {
    setBusy(false);
    const msg = err && err.message ? err.message : 'Something went wrong.';
    alert(msg);
  }

  function cloneCounts(counts) {
    return { red: counts.red || 0, blue: counts.blue || 0, yellow: counts.yellow || 0 };
  }

  function countTotal(counts) {
    return (counts.red || 0) + (counts.blue || 0) + (counts.yellow || 0);
  }

  function countMatching(arr, value) {
    return (arr || []).filter(v => v === value).length;
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function interleaveSlots(left, right) {
    const out = [];
    const max = Math.max(left.length, right.length);
    for (let i = 0; i < max; i++) {
      if (left[i]) out.push(left[i]);
      if (right[i]) out.push(right[i]);
    }
    return out;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/`/g, '&#96;');
  }

  function byId(id) { return document.getElementById(id); }
</script>
