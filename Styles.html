<style>
  :root {
    --bg-deep: #020713;
    --bg-deeper: #00030a;
    --panel: rgba(7, 19, 38, 0.94);
    --panel-2: rgba(11, 27, 51, 0.96);
    --panel-3: rgba(19, 10, 43, 0.92);
    --cyan: #17c8ff;
    --cyan-soft: rgba(23, 200, 255, 0.26);
    --red: #ff3b34;
    --red-dark: #7d0810;
    --blue: #2388ff;
    --blue-dark: #082f70;
    --yellow: #ffc928;
    --yellow-dark: #7a5700;
    --purple: #9d4dff;
    --green: #35e36f;
    --text-main: #f5f8ff;
    --text-muted: #a8bdd8;
    --border-soft: rgba(90, 210, 255, 0.38);
    --shadow-cyan: 0 0 22px rgba(23, 200, 255, 0.35);
    --shadow-red: 0 0 22px rgba(255, 59, 52, 0.36);
    --shadow-blue: 0 0 22px rgba(35, 136, 255, 0.36);
    --shadow-yellow: 0 0 22px rgba(255, 201, 40, 0.36);
    --active-board-height: clamp(360px, 46vh, 520px);
    --inactive-board-height: 185px;
    --compact-active-board-height: clamp(235px, 32vh, 320px);
    --compact-inactive-board-height: 118px;
    --chart-height: 125px;
    --compact-chart-height: 72px;
  }

  * { box-sizing: border-box; }

  html,
  body {
    min-height: 100%;
  }

  body {
    margin: 0;
    color: var(--text-main);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 25% 12%, rgba(23, 200, 255, 0.16), transparent 28%),
      radial-gradient(circle at 74% 26%, rgba(157, 77, 255, 0.14), transparent 24%),
      linear-gradient(180deg, #020713 0%, #061426 55%, #020713 100%);
  }

  h1, h2, h3, h4, p { margin: 0; }
  ul { margin: 8px 0 0 18px; padding: 0; }
  button, input, select { font: inherit; }
  .hidden { display: none !important; }
  .screen { display: none; }
  .screen.active { display: block; }

  .app-shell {
    min-height: 100vh;
  }

  .mission-screen {
    min-height: 100vh;
    display: none;
    place-items: center;
    padding: 22px;
  }

  .mission-screen.active {
    display: grid;
  }

  .mission-card {
    width: min(880px, 100%);
    background: linear-gradient(180deg, rgba(9, 24, 47, 0.98), rgba(4, 10, 24, 0.98));
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    box-shadow: var(--shadow-cyan), inset 0 0 28px rgba(23, 200, 255, 0.08);
    padding: 26px;
  }

  .login-card {
    width: min(560px, calc(100vw - 32px));
  }

  .brand-lockup {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-lockup.compact h1 {
    font-size: 28px;
  }

  .brand-flask,
  .logo-mark {
    display: grid;
    place-items: center;
    width: 62px;
    height: 62px;
    border: 2px solid var(--cyan);
    border-radius: 14px;
    color: #081629;
    background: radial-gradient(circle at 50% 78%, #45e6ff 0 28%, #0f86d9 29% 50%, #dff9ff 51% 56%, transparent 57%);
    font-weight: 1000;
    text-shadow: none;
    box-shadow: var(--shadow-cyan);
  }

  .brand-lockup h1,
  .logo-title {
    color: #ffffff;
    font-size: 36px;
    font-weight: 1000;
    line-height: 1;
    text-transform: uppercase;
    text-shadow: 0 0 16px rgba(23, 200, 255, 0.45);
  }

  .brand-lockup p,
  .logo-sub {
    margin-top: 4px;
    color: var(--text-muted);
    font-weight: 700;
  }

  .field {
    margin-top: 18px;
  }

  .field label {
    display: block;
    color: #dcebff;
    font-weight: 800;
    margin-bottom: 7px;
  }

  input,
  select {
    width: 100%;
    min-height: 50px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(120, 210, 255, 0.48);
    background: rgba(0, 8, 20, 0.82);
    color: var(--text-main);
    outline: none;
  }

  input:focus,
  select:focus,
  button:focus-visible {
    outline: 3px solid rgba(255, 201, 40, 0.72);
    outline-offset: 2px;
  }

  .btn {
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 12px;
    min-height: 52px;
    padding: 12px 18px;
    color: var(--text-main);
    font-weight: 1000;
    line-height: 1.05;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 0 18px rgba(0, 0, 0, 0.35);
    transition: transform 120ms ease, filter 120ms ease, box-shadow 120ms ease;
  }

  .btn:hover:not(:disabled) {
    transform: translateY(-1px);
    filter: brightness(1.08);
  }

  .btn:active:not(:disabled) {
    transform: translateY(1px) scale(0.99);
  }

  .btn:disabled {
    opacity: 0.48;
    cursor: default;
    transform: none;
    filter: grayscale(0.35);
  }

  .btn-primary,
  .btn-start {
    background: linear-gradient(180deg, #ff554e, #a60c18);
    box-shadow: var(--shadow-red);
  }

  .btn-secondary {
    color: #06101f;
    background: linear-gradient(180deg, #eff9ff, #8edfff);
  }

  .btn-roll {
    background: linear-gradient(180deg, #9d4dff, #35146e);
    box-shadow: 0 0 22px rgba(157, 77, 255, 0.38);
  }

  .btn-success {
    background: linear-gradient(180deg, #44ff87, #117f3a);
    box-shadow: 0 0 22px rgba(53, 227, 111, 0.38);
  }

  .utility-submit {
    min-height: 40px;
    padding: 7px 10px;
    font-size: 10px;
    background: linear-gradient(180deg, rgba(40, 55, 73, 0.96), rgba(12, 20, 33, 0.96));
    color: #d7e9ff;
  }

  .error {
    margin-top: 14px;
    color: #ffb4b4;
    font-weight: 800;
  }

  .mode-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    margin-bottom: 20px;
  }

  .student-pill,
  .pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    font-weight: 900;
  }

  .student-pill {
    padding: 9px 14px;
    color: var(--yellow);
    background: rgba(255, 201, 40, 0.1);
    border: 1px solid rgba(255, 201, 40, 0.34);
  }

  .pill {
    padding: 7px 11px;
    font-size: 12px;
  }

  .pill-blue {
    color: #bfeaff;
    background: rgba(23, 200, 255, 0.12);
    border: 1px solid rgba(23, 200, 255, 0.34);
  }

  .pill-orange {
    color: #ffe39a;
    background: rgba(255, 201, 40, 0.12);
    border: 1px solid rgba(255, 201, 40, 0.34);
  }

  .mode-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }

  .mode-card {
    border-radius: 12px;
    padding: 20px;
    background: rgba(3, 9, 22, 0.72);
    border: 1px solid var(--border-soft);
    box-shadow: inset 0 0 24px rgba(23, 200, 255, 0.07);
  }

  .mode-card.required { border-color: rgba(35, 136, 255, 0.62); }
  .mode-card.extra { border-color: rgba(255, 201, 40, 0.62); }

  .mode-card h2 {
    margin: 12px 0 8px;
    font-size: 28px;
    text-transform: uppercase;
  }

  .mode-card p {
    min-height: 72px;
    color: var(--text-muted);
    line-height: 1.42;
  }

  .mode-card .btn {
    margin-top: 16px;
    width: 100%;
  }

  .arcade-screen.active {
    min-height: 100vh;
    min-height: 100dvh;
    display: block;
  }

  .game-shell {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto auto auto;
    gap: 7px;
    padding: 8px;
    background:
      linear-gradient(rgba(23, 200, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(23, 200, 255, 0.035) 1px, transparent 1px),
      radial-gradient(circle at 50% 28%, rgba(23, 200, 255, 0.13), transparent 38%),
      var(--bg-deep);
    background-size: 34px 34px, 34px 34px, auto, auto;
  }

  .hud-top {
    display: grid;
    grid-template-columns: minmax(140px, 0.62fr) minmax(300px, 2.75fr) minmax(92px, 0.36fr) minmax(160px, 0.68fr) minmax(92px, 0.38fr);
    gap: 7px;
    align-items: stretch;
  }

  .logo-panel,
  .title-panel,
  .round-badge,
  .turn-panel,
  .hud-card,
  .footer-tile,
  .directive-strip,
  .action-bar {
    border: 1px solid var(--border-soft);
    background: linear-gradient(180deg, rgba(9, 28, 53, 0.93), rgba(3, 9, 22, 0.95));
    box-shadow: inset 0 0 24px rgba(23, 200, 255, 0.07), 0 0 18px rgba(0, 0, 0, 0.36);
  }

  .logo-panel {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 58px;
    padding: 7px;
    border-radius: 14px 6px 6px 14px;
  }

  .logo-mark {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    font-size: 15px;
  }

  .logo-title {
    font-size: 18px;
  }

  .logo-sub {
    font-size: 10px;
  }

  .title-panel {
    position: relative;
    min-height: 58px;
    padding: 8px 14px;
    border-radius: 6px;
    overflow: hidden;
  }

  .title-panel::before,
  .directive-strip::before,
  .action-bar::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(110deg, transparent 0 36%, rgba(23, 200, 255, 0.1) 37% 39%, transparent 40% 100%);
  }

  .arcade-title {
    font-size: clamp(28px, 3.4vw, 52px);
    line-height: 0.9;
    color: #ffffff;
    font-weight: 1000;
    text-transform: uppercase;
    text-shadow: 0 4px 0 #071326, 0 0 18px rgba(255, 255, 255, 0.28);
  }

  .title-panel p {
    margin-top: 5px;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 700;
  }

  .round-badge {
    display: grid;
    place-items: center;
    border-radius: 16px;
    color: var(--yellow);
    font-size: 14px;
    font-weight: 1000;
    text-align: center;
    text-transform: uppercase;
    box-shadow: var(--shadow-yellow);
  }

  .turn-panel {
    display: grid;
    align-content: center;
    gap: 2px;
    padding: 7px 10px;
    border-radius: 16px;
    border-color: rgba(255, 201, 40, 0.55);
    box-shadow: var(--shadow-yellow);
  }

  .turn-panel span {
    color: var(--yellow);
    font-size: 11px;
    font-weight: 1000;
    text-transform: uppercase;
  }

  .turn-panel strong {
    color: #ffffff;
    font-size: 16px;
  }

  .turn-panel em {
    color: var(--text-muted);
    font-size: 10px;
    font-style: normal;
    font-weight: 800;
  }

  .directive-strip {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(104px, auto);
    gap: 9px;
    align-items: center;
    min-height: 58px;
    padding: 8px 14px;
    border-radius: 14px;
    overflow: hidden;
  }

  .directive-title {
    color: #ffffff;
    font-size: clamp(28px, 4.3vw, 58px);
    line-height: 0.95;
    font-weight: 1000;
    text-transform: uppercase;
    text-shadow: 0 0 16px rgba(255, 255, 255, 0.28);
  }

  .directive-title strong,
  .is-removing .directive-title {
    color: var(--yellow);
    text-shadow: var(--shadow-yellow);
  }

  .directive-sub {
    margin-top: 3px;
    color: #ffdddd;
    font-size: 14px;
    font-weight: 900;
    text-transform: uppercase;
  }

  .removal-badge {
    display: grid;
    place-items: center;
    min-width: 108px;
    padding: 7px;
    border: 1px solid rgba(23, 200, 255, 0.42);
    border-radius: 14px;
    background: rgba(0, 10, 25, 0.76);
  }

  .removal-badge span {
    color: #bfeaff;
    font-size: 10px;
    font-weight: 1000;
    text-transform: uppercase;
    text-align: center;
  }

  .removal-badge strong {
    color: var(--yellow);
    font-size: 42px;
    line-height: 0.95;
    text-shadow: var(--shadow-yellow);
  }

  .simulation-grid {
    display: grid;
    grid-template-columns: minmax(145px, 0.55fr) minmax(610px, 3.2fr) minmax(170px, 0.68fr);
    gap: 7px;
    min-height: 0;
  }

  .extra-grid {
    grid-template-columns: minmax(145px, 0.55fr) minmax(620px, 3.25fr) minmax(175px, 0.68fr);
  }

  .side-stack {
    display: grid;
    align-content: start;
    gap: 7px;
  }

  .hud-card {
    border-radius: 14px;
    padding: 8px 10px;
  }

  .left-stack .hud-card {
    border-color: rgba(157, 77, 255, 0.45);
    background: linear-gradient(180deg, rgba(25, 7, 56, 0.94), rgba(5, 4, 18, 0.96));
    box-shadow: 0 0 18px rgba(157, 77, 255, 0.18), inset 0 0 20px rgba(157, 77, 255, 0.08);
  }

  .hud-card h3 {
    color: #ffffff;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 1000;
    text-transform: uppercase;
  }

  .action-heading {
    color: var(--yellow);
    margin-bottom: 5px;
    font-size: 11px;
    font-weight: 1000;
    text-transform: uppercase;
  }

  .hud-card p,
  .instruction-feed,
  .step-box {
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.28;
    font-weight: 700;
  }

  .dice-row {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin: 8px 0 9px;
  }

  .die-face {
    display: grid;
    place-items: center;
    width: 72px;
    height: 72px;
    border-radius: 16px;
    color: #160b2b;
    background: radial-gradient(circle at 32% 25%, #ffffff, #d4c5ff 54%, #7d4dda);
    font-size: 42px;
    font-weight: 1000;
    box-shadow: 0 0 18px rgba(157, 77, 255, 0.46);
  }

  .roll-card {
    position: relative;
    overflow: hidden;
  }

  .roll-card::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 36%, rgba(255, 201, 40, 0.22), transparent 48%);
    transition: opacity 160ms ease;
  }

  .roll-card.is-roll-phase {
    border-color: rgba(255, 201, 40, 0.72);
    box-shadow: var(--shadow-yellow), inset 0 0 24px rgba(255, 201, 40, 0.11);
  }

  .roll-card.is-roll-phase::after {
    opacity: 1;
  }

  .die-ready {
    color: #2a1c00;
    background: radial-gradient(circle at 32% 25%, #fff9cf, #ffc928 58%, #a96a00);
    box-shadow: var(--shadow-yellow);
  }

  .die-taken {
    color: #031022;
    background: radial-gradient(circle at 32% 25%, #ffffff, #78d6ff 58%, #2388ff);
    box-shadow: var(--shadow-blue);
  }

  .die-missed {
    color: #2b0000;
    background: radial-gradient(circle at 32% 25%, #ffe9e8, #ff6f68 58%, #a60c18);
    box-shadow: var(--shadow-red);
  }

  .die-empty {
    color: #8aa3c4;
    background: radial-gradient(circle at 32% 25%, #e3edf8, #5e7594 58%, #18263d);
    box-shadow: 0 0 14px rgba(120, 160, 210, 0.22);
  }

  .roll-readout,
  .small-status {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    border-radius: 999px;
    padding: 4px 8px;
    color: var(--text-main);
    font-size: 10px;
    font-weight: 1000;
    text-transform: uppercase;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.08);
  }

  .roll-card .roll-readout {
    display: flex;
    justify-content: center;
    width: 100%;
    text-align: center;
  }

  .roll-card.roll-taken .roll-readout {
    color: #bfeaff;
    border-color: rgba(35, 136, 255, 0.52);
    background: rgba(35, 136, 255, 0.13);
  }

  .roll-card.roll-missed .roll-readout {
    color: #ffd3d0;
    border-color: rgba(255, 59, 52, 0.58);
    background: rgba(255, 59, 52, 0.13);
  }

  .mini-stat {
    display: grid;
    margin-top: 7px;
  }

  .mini-stat strong {
    color: #ffffff;
    font-size: 22px;
    line-height: 1;
  }

  .mini-stat span {
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 800;
  }

  .key-card p {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 5px 0;
  }

  .key-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    box-shadow: 0 0 10px currentColor;
  }

  .key-dot.red { color: var(--red); background: var(--red); }
  .key-dot.blue { color: var(--blue); background: var(--blue); }
  .key-dot.yellow { color: var(--yellow); background: var(--yellow); }

  .battle-stage {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    min-width: 0;
    min-height: 0;
    gap: 7px;
  }

  .instruction-feed {
    min-height: 32px;
    display: flex;
    align-items: center;
    padding: 6px 10px;
    border: 1px solid rgba(255, 59, 52, 0.42);
    border-radius: 12px;
    color: #ffe1e1;
    background: linear-gradient(90deg, rgba(125, 8, 16, 0.72), rgba(25, 5, 12, 0.55));
    text-transform: uppercase;
  }

  .compare-board-pair {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 7px;
    min-height: 0;
  }

  .patient-panel {
    display: grid;
    grid-template-rows: auto minmax(280px, 1fr) auto auto;
    min-width: 0;
    min-height: 0;
    padding: 7px;
    border-radius: 18px;
    border: 2px solid rgba(23, 200, 255, 0.35);
    background: rgba(2, 7, 19, 0.78);
    box-shadow: inset 0 0 28px rgba(23, 200, 255, 0.08);
    transition: opacity 140ms ease, box-shadow 140ms ease, border-color 140ms ease, transform 140ms ease, filter 140ms ease;
  }

  .patient-panel:not(.active-patient) {
    opacity: 0.58;
    filter: saturate(0.76);
  }

  .patient-panel.active-patient {
    border-color: var(--cyan);
    box-shadow: var(--shadow-cyan), inset 0 0 36px rgba(23, 200, 255, 0.12);
  }

  .panel-a.active-patient {
    border-color: var(--blue);
    box-shadow: var(--shadow-blue), inset 0 0 36px rgba(35, 136, 255, 0.12);
  }

  .panel-b.active-patient {
    border-color: var(--red);
    box-shadow: var(--shadow-red), inset 0 0 36px rgba(255, 59, 52, 0.12);
  }

  .mode-compare.active-patient-a .compare-board-pair {
    grid-template-columns: minmax(0, 1.78fr) minmax(165px, 0.52fr);
  }

  .mode-compare.active-patient-b .compare-board-pair {
    grid-template-columns: minmax(165px, 0.52fr) minmax(0, 1.78fr);
  }

  .mode-compare .patient-panel.active-patient,
  .mode-extra .patient-panel.active-patient {
    grid-template-rows: auto minmax(360px, 1fr) auto auto;
    transform: translateY(-1px);
  }

  .mode-compare .patient-panel:not(.active-patient) {
    grid-template-rows: auto minmax(var(--inactive-board-height), 1fr) auto;
    align-self: stretch;
    overflow: hidden;
  }

  .mode-compare .patient-panel:not(.active-patient) .patient-head {
    align-items: center;
  }

  .mode-compare .patient-panel:not(.active-patient) .patient-head h2 {
    font-size: 18px;
  }

  .mode-compare .patient-panel:not(.active-patient) .patient-head p,
  .mode-compare .patient-panel:not(.active-patient) .small-status {
    font-size: 9px;
  }

  .mode-compare .patient-panel.active-patient .anatomy-board,
  .mode-extra .patient-panel.active-patient .anatomy-board {
    min-height: var(--active-board-height);
  }

  .mode-compare .patient-panel.active-patient .board-svg,
  .mode-extra .patient-panel.active-patient .board-svg {
    min-height: var(--active-board-height);
  }

  .mode-compare .patient-panel:not(.active-patient) .anatomy-board,
  .mode-compare .patient-panel:not(.active-patient) .board-svg {
    min-height: var(--inactive-board-height);
  }

  .mode-compare .patient-panel:not(.active-patient) .anatomy-board::before {
    font-size: 8px;
  }

  .patient-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 6px;
    margin-bottom: 5px;
  }

  .patient-head h2 {
    color: #ffffff;
    font-size: clamp(20px, 1.8vw, 32px);
    line-height: 1;
    font-weight: 1000;
    text-transform: uppercase;
  }

  .patient-head p {
    margin-top: 2px;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 800;
  }

  .dose-good {
    color: #abffc8;
    border-color: rgba(53, 227, 111, 0.45);
    background: rgba(53, 227, 111, 0.12);
  }

  .dose-miss {
    color: #ffb7b7;
    border-color: rgba(255, 59, 52, 0.45);
    background: rgba(255, 59, 52, 0.12);
  }

  .dose-wait {
    color: #cde7ff;
    border-color: rgba(23, 200, 255, 0.34);
    background: rgba(23, 200, 255, 0.1);
  }

  .anatomy-board {
