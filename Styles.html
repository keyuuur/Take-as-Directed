<style>
  :root {
    --bg: #e8eef4;
    --surface: #f8fbff;
    --card: #ffffff;
    --line: #c6d2dd;
    --text: #1f2f3b;
    --muted: #4f6171;
    --header-blue: #2c5d7d;
    --header-orange: #7f5a34;
    --red: #d9534f;
    --blue: #337ab7;
    --yellow: #f0ad4e;
    --shadow: 0 8px 22px rgba(21, 36, 52, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    color: var(--text);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #dfe7ef 0%, #ced9e5 100%);
  }

  h1, h2, h3, h4, p { margin: 0; }
  ul { margin: 8px 0 0 18px; padding: 0; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }

  .app-shell {
    max-width: 1320px;
    margin: 0 auto;
    padding: 14px;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  .simple-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 24px;
  }

  .login-card, .finish-card {
    max-width: 560px;
    margin: 42px auto;
  }

  .mode-card-wrap { margin-top: 18px; }

  .field { margin-top: 16px; }

  .field label {
    display: block;
    font-weight: 700;
    margin-bottom: 6px;
  }

  input, select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    font-size: 16px;
  }

  .btn {
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.1;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  }

  .btn:hover { transform: translateY(-1px); }

  .btn:disabled {
    opacity: 0.55;
    cursor: default;
    transform: none;
    box-shadow: none;
  }

  .btn-primary {
    background: linear-gradient(180deg, #e15f58, #c94640);
    color: #ffffff;
  }

  .btn-secondary {
    background: linear-gradient(180deg, #f6f8fa, #e2e8ef);
    border-color: #b5c2ce;
    color: #24394b;
  }

  .btn-danger {
    background: linear-gradient(180deg, #f3f4f6, #dde2e8);
    border-color: #adb8c4;
    color: #202e3d;
  }

  .btn-miss {
    background: linear-gradient(180deg, #666f7a, #515a64);
    color: #ffffff;
  }

  .btn-success {
    background: linear-gradient(180deg, #45b76a, #2c9650);
    color: #ffffff;
  }

  .error {
    color: #b83a36;
    font-weight: 700;
    margin-top: 12px;
  }

  .mode-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }

  .student-pill, .pill, .header-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    font-weight: 700;
  }

  .student-pill {
    background: #e8f0f8;
    color: #2e5778;
    padding: 10px 16px;
  }

  .pill {
    padding: 8px 12px;
    font-size: 13px;
  }

  .pill-blue { background: #e3f0fc; color: #2d5576; }
  .pill-orange { background: #fff1dd; color: #7c5b33; }

  .mode-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 18px;
  }

  .mode-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
    background: linear-gradient(180deg, #ffffff, #f6fbff);
  }

  .mode-card h2 { margin-top: 10px; margin-bottom: 10px; }

  .mode-card p {
    margin-bottom: 16px;
    color: var(--muted);
    line-height: 1.45;
  }

  .mode-card.required { border-top: 5px solid #2f78ba; }
  .mode-card.extra { border-top: 5px solid #d0903c; }

  .sim-header {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 6px 6px 0 0;
    color: #ffffff;
    border: 1px solid #2b5a78;
    box-shadow: var(--shadow);
  }

  .blue-theme { background: linear-gradient(180deg, #2e678d, #255a7b); }
  .orange-theme { background: linear-gradient(180deg, #8a653d, #725330); }

  .menu-icon {
    width: 34px;
    height: 34px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 4px;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 4px;
  }

  .menu-icon span {
    display: block;
    width: 16px;
    height: 2px;
    background: #ffffff;
    border-radius: 2px;
  }

  .clinical-title {
    font-size: 20px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sim-header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-pill {
    min-height: 30px;
    padding: 4px 10px;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.24);
    font-size: 12px;
  }

  .lab-dashboard {
    border: 1px solid #b8c8d7;
    border-top: none;
    border-radius: 0 0 8px 8px;
    background: linear-gradient(180deg, #f8fbff, #edf3f9);
    box-shadow: var(--shadow);
    padding: 10px;
  }

  .compare-layout,
  .extra-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 290px;
    gap: 10px;
    align-items: start;
  }

  .simulation-area {
    display: grid;
    gap: 10px;
    min-width: 0;
  }

  .patients-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .patient-panel {
    background: #f8fbfe;
    border: 1px solid #becddd;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(16, 31, 46, 0.09);
    padding: 10px;
  }

  .panel-a { border-top: 4px solid #2f77b8; }
  .panel-b { border-top: 4px solid #d3544f; }
  .panel-extra { border-top: 4px solid #4d87bb; }

  .patient-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }

  .patient-head h2 {
    font-size: 43px;
    line-height: 1;
  }

  .patient-head p {
    margin-top: 2px;
    color: #334658;
    font-size: 29px;
    font-weight: 600;
  }

  .roll-stack {
    display: flex;
    flex-direction: column;
    gap: 5px;
    align-items: flex-end;
  }

  .small-status {
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid transparent;
  }

  .dose-good {
    background: #d8f0e1;
    border-color: #b4dcc0;
    color: #1c6a38;
  }

  .dose-miss {
    background: #fde5e2;
    border-color: #e3b5b0;
    color: #9a3430;
  }

  .dose-wait {
    background: #edf2f7;
    border-color: #ced7e1;
    color: #4d5d6d;
  }

  .roll-badge {
    background: #edf2f7;
    border-color: #ced7e1;
    color: #4d5d6d;
  }

  .anatomy-board {
    background: #f2ede9;
    border: 1px solid #b5c4d2;
    border-radius: 10px;
    padding: 6px;
    min-height: 250px;
  }

  .counts-box {
    margin: 8px auto 0;
    width: min(230px, 100%);
    background: #ffffff;
    border: 1px solid #bfcddb;
    border-radius: 8px;
    padding: 10px 12px;
  }

  .counts-box h4 {
    font-size: 14px;
    margin-bottom: 6px;
  }

  .count-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 20px;
    font-weight: 700;
    margin: 6px 0;
  }

  .count-line.total {
    font-size: 22px;
    margin-top: 8px;
  }

  .count-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.15);
    flex: 0 0 auto;
  }

  .count-red { background: var(--red); }
  .count-blue { background: var(--blue); }
  .count-yellow { background: var(--yellow); }
  .count-total { background: #8da4b7; }

  .step-box {
    margin-top: 8px;
    background: #eef4fa;
    border: 1px solid #becddd;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.35;
    color: #2f4355;
  }

  .single-patient-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 220px;
    gap: 10px;
    align-items: start;
  }

  .status-strip {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .status-item {
    background: #ffffff;
    border: 1px solid #c0cedb;
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
  }

  .status-item strong {
    color: #2f5d7d;
    font-size: 15px;
  }

  .control-panel {
    background: #ffffff;
    border: 1px solid #bccbd9;
    border-radius: 10px;
    padding: 10px;
  }

  .instruction-bar {
    background: #dcecf9;
    border: 1px solid #bfd4e6;
    border-radius: 8px;
    padding: 9px 10px;
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 15px;
  }

  .instruction-bar strong {
    color: #224661;
    font-size: 16px;
    white-space: nowrap;
  }

  .action-copy {
    margin-top: 7px;
    font-size: 13px;
    color: #3b5163;
  }

  .controls-row {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: stretch;
  }

  .controls-row .btn {
    min-width: 180px;
    min-height: 58px;
  }

  .remove-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    flex: 1 1 100%;
  }

  .remove-btn {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-width: 170px;
    min-height: 58px;
    border-radius: 10px;
    border: 1px solid transparent;
    color: #ffffff;
    font-weight: 700;
    font-size: 18px;
    padding: 0 10px;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
    position: relative;
  }

  .remove-count {
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.22);
    padding: 2px 10px;
    font-size: 14px;
    font-weight: 700;
  }

  .remove-btn.red { background: linear-gradient(180deg, #e26962, #cc4d47); }
  .remove-btn.blue { background: linear-gradient(180deg, #4289ca, #2e6fa8); }
  .remove-btn.yellow { background: linear-gradient(180deg, #f2bf68, #dd9f37); color: #4e390b; }
  .remove-btn:disabled { opacity: 0.55; cursor: default; }

  .remove-btn.extinct::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(30deg, transparent calc(50% - 3px), rgba(186, 33, 33, 0.9) calc(50% - 3px), rgba(186, 33, 33, 0.9) calc(50% + 3px), transparent calc(50% + 3px)),
      linear-gradient(-30deg, transparent calc(50% - 3px), rgba(186, 33, 33, 0.9) calc(50% - 3px), rgba(186, 33, 33, 0.9) calc(50% + 3px), transparent calc(50% + 3px));
    border-radius: 10px;
    pointer-events: none;
  }

  .remove-info {
    margin-top: 8px;
    font-size: 14px;
    font-weight: 700;
    color: #3d5568;
  }

  .rule-box {
    margin-top: 9px;
    border-top: 1px solid #d6e1ea;
    padding-top: 8px;
    color: #32495a;
    font-size: 13px;
  }

  .charts-sidebar {
    display: grid;
    gap: 10px;
    position: sticky;
    top: 10px;
  }

  .graph-card {
    background: #ffffff;
    border: 1px solid #becddb;
    border-radius: 8px;
    box-shadow: 0 3px 8px rgba(18, 34, 49, 0.1);
    padding: 8px;
  }

  .graph-card h3 {
    margin-bottom: 4px;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
  }

  .chart {
    height: 250px;
  }

  .reflection-wrap {
    margin-top: 4px;
  }

  .summary-box, .question-card {
    background: #ffffff;
    border: 1px solid #becddb;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(18, 34, 49, 0.08);
    padding: 14px;
    margin-top: 12px;
  }

  .question-card legend {
    font-weight: 700;
    margin-bottom: 10px;
    font-size: 15px;
  }

  .choice {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    margin: 8px 0;
    font-size: 14px;
  }

  .choice input {
    width: auto;
    margin-top: 2px;
    transform: scale(1.2);
  }

  .footer-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .board-svg {
    width: 100%;
    height: 260px;
    display: block;
  }

  .body-stroke { stroke: #3e4f5d; stroke-width: 4; fill: #f6ddcf; }
  .body-shadow { fill: rgba(219, 177, 157, 0.18); }
  .airway-fill { fill: #d7dcdf; }
  .airway-stroke { stroke: #687178; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .airway-ring { stroke: rgba(255, 255, 255, 0.75); stroke-width: 2; }
  .lung-fill-left, .lung-fill-right { fill: #f6dedb; opacity: 0.95; }
  .lung-stroke { stroke: #3b4b58; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .lung-highlight { stroke: rgba(255, 255, 255, 0.5); stroke-width: 5; fill: none; stroke-linecap: round; }
  .bronchi { stroke: rgba(95, 105, 116, 0.68); stroke-width: 3; fill: none; stroke-linecap: round; }

  .bacterium {
    stroke: rgba(255, 255, 255, 0.94);
    stroke-width: 3;
    filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.2));
  }

  .bacterium.red { fill: var(--red); }
  .bacterium.blue { fill: var(--blue); }
  .bacterium.yellow { fill: #f2d11a; }
  .bacterium.new-token { animation: popIn 0.4s ease; }

  @keyframes popIn {
    0% { transform: scale(0.45); opacity: 0.25; }
    80% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); }
  }

  #screen-compare.results-mode .patients-grid,
  #screen-compare.results-mode .status-strip,
  #screen-compare.results-mode .control-panel,
  #screen-extra.results-mode .patient-panel,
  #screen-extra.results-mode .status-strip,
  #screen-extra.results-mode .control-panel {
    display: none;
  }

  #screen-compare.results-mode .compare-layout,
  #screen-extra.results-mode .extra-layout {
    grid-template-columns: 1fr;
  }

  #screen-compare.results-mode .charts-sidebar,
  #screen-extra.results-mode .charts-sidebar {
    position: static;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(13, 24, 36, 0.52);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  .overlay-card {
    width: min(560px, calc(100vw - 32px));
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #b8c8d7;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
    padding: 24px;
    text-align: center;
  }

  .overlay-card h2 {
    color: #2f5f80;
    font-size: 28px;
    margin-bottom: 8px;
  }

  .overlay-card p {
    color: #41576a;
    font-size: 18px;
    line-height: 1.45;
    margin-bottom: 14px;
  }

  @media (max-width: 1200px) {
    .compare-layout,
    .extra-layout {
      grid-template-columns: 1fr;
    }

    .charts-sidebar {
      position: static;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .clinical-title {
      white-space: normal;
      font-size: 18px;
    }

    .sim-header {
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-rows: auto auto;
    }

    .sim-header-right {
      grid-column: 1 / span 2;
      flex-wrap: wrap;
    }
  }

  @media (max-width: 980px) {
    .patients-grid {
      grid-template-columns: 1fr;
    }

    .single-patient-body {
      grid-template-columns: 1fr;
    }

    .status-strip {
      grid-template-columns: 1fr;
    }

    .controls-row .btn,
    .remove-btn {
      min-width: 100%;
    }

    .remove-controls {
      flex: 1 1 100%;
    }

    .clinical-title {
      font-size: 16px;
    }
  }
</style>
